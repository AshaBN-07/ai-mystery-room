

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Mystery Room</title>
<style>
body{margin:0;padding:20px;background:#101426;color:white;font-family:Arial;text-align:center}
h1{color:#a78bfa}
.room{max-width:500px;margin:25px auto;padding:22px;background:#202944;border:1px solid #8b5cf6;border-radius:16px}
button,select{padding:12px;margin:8px;border:0;border-radius:8px;font-size:16px}
button{background:#8b5cf6;color:white}
p{line-height:1.6}
</style>
</head>
<body>
<h1>🔎 AI Mystery Room</h1>
<p>Every clue tells a story. Can you solve the case?</p>
<div class="room">
<h2>🕵️ Enter the Mystery</h2>
<p>Choose your difficulty</p>
<select id="difficulty">
<option>Easy</option><option>Medium</option><option>Hard</option>
</select>
<br>
<button onclick="startMystery()">Start Mystery</button>
<div id="game">Your first case is waiting...</div>
</div>
<script>
function startMystery(){
document.getElementById("game").innerHTML=`
<h3>💎 The Missing Diamond</h3>
<p>A diamond disappeared from a locked room!</p>
<p>Difficulty: ${document.getElementById("difficulty").value}</p>
<p>Suspects: Alex, Mia and Ryan</p>
<button onclick="showClue()">Reveal a Clue</button>
<p id="clue"></p>
<h3>Who stole the diamond?</h3>
<select id="suspect">
<option value="">Choose a suspect</option>
<option>Alex</option><option>Mia</option><option>Ryan</option>
</select>
<br>
<button onclick="checkAnswer()">Check Answer</button>
<p id="result"></p>`;
}
function showClue(){
document.getElementById("clue").textContent=
"🔎 Muddy footprints were found near the window. Ryan's shoes were muddy.";
}
function checkAnswer(){
const suspect=document.getElementById("suspect").value;
const result=document.getElementById("result");
if(!suspect){result.textContent="Please select a suspect!";return;}
if(suspect==="Ryan"){
result.textContent="🎉 Correct! Ryan is the culprit. Case solved!";
}else{
result.textContent="❌ Not quite! Review the clue and try again.";
}
}
</script>
</body>
</html>
